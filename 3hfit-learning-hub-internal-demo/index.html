s"><div class="unit"><span class="unitIcon">01</span><div><h4>产品总览 · 找到课程</h4><p>展示全部认证、工作坊、研习营与师资发展项目</p></div></div><div class="unit"><span class="unitIcon">02</span><div><h4>单课学习 · 进入教材</h4><p>章节、资料、更新记录和个人批注关联</p></div></div><div class="unit"><span class="unitIcon">03</span><div><h4>应用实践 · 提交作业</h4><p>作业任务、提交记录、反馈及学习档案形成闭环</p></div></div></div>`}function home(){let x=p('snc');return `${header('学习，从这里继续。','一个账号集中管理全部 3HFIT 专业课程、教材与学习成果。','WELCOME BACK',btn('探索课程产品','catalog','secondary'))}<div class="hero"><span class="tag">3HFIT PROFESSIONAL EDUCATION</span><h2>为专业教练建立一个<br>持续成长的学习空间</h2><p>把课程内容、教材版本、应用作业与讲师反馈连接起来。管理层可以直接体验这一条完整的学习路径。</p><div class="buttonrow">${btn('进入我的课程 →','course','lightbtn')} ${btn('浏览全部产品','catalog','outline')}</div></div><div class="grid4 stats">${stat('已加入课程','3','演示账号示例')}${stat('最近学习进度','64%','SNC 2026')}${stat('待完成作业','2','可以打开并模拟提交')}${stat('教材更新','3','查看修订记录示例')}</div><div class="grid2"><section><div class="sectline"><h2>继续上次学习</h2><button class="textbtn" data-action="course">查看全部 →</button></div><div class="panel coursebig"><div class="cover"><span class="type">CERTIFICATION</span><b>SNC<br>2026</b><span class="type">3HFIT ACADEMY</span></div><div class="coursedetail">${tag('正在学习','green')}<h3>${x.name}</h3><div class="mini">当前模块 · ${x.chapter}</div>${progress(x)}<div class="mini">学习进度 ${pct(x)}%</div><div style="margin-top:14px">${btn('继续学习 →','course','primary')}</div></div></div><div class="sectline"><h2>下一步学习任务</h2><span class="sub">示例任务</span></div><div class="panel">${unitRow('完成第六章阅读','本周 · 在线教材','reader')}${unitRow('提交客户案例分析','本周 · 作业任务','tasks')}${unitRow('查看新版教材变更','资料库 · 修订记录','materials')}</div></section><section><div class="sectline"><h2>学习设计路径</h2><span class="sub">产品架构预览</span></div><div class="panel">${roadmap()}</div><div class="sectline"><h2>近期课程</h2><button class="textbtn" data-action="catalog">查看所有 →</button></div><div class="panel">${products.slice(1,4).map(x=>`<div class="unit"><span class="unitIcon">◈</span><div><h4>${x.name}</h4><p>${x.type}</p></div><button class="textbtn" data-course="${x.id}">查看 →</button></div>`).join('')}</div></section></div>`}function unitRow(title,sub,action){return `<div class="unit"><span class="unitIcon">↗</span><div><h4>${title}</h4><p>${sub}</p></div><button class="textbtn" data-action="${action}">打开</button></div>`}function catalog(){let filtered=products.filter(x=>filter==='all'||x.kind===filter);return `${header('全部课程与产品','认证课程、专项进阶、研习营、讲师培养在一个统一的教育产品体系中呈现。','COURSE PORTFOLIO',btn('查看学员学习空间','course'))}<div class="panel" style="margin-bottom:22px;background:linear-gradient(90deg,#f2fafa,#fff)"><b>产品呈现建议</b><p class="muted" style="margin:6px 0 0">对外：按目标与成长阶段选择课程。登录后：优先看到本人已加入的课程，同时保留完整产品目录。这里仅展示示例产品，具体招生状态待确认。</p></div><div class="filterbar">${[['all','全部产品'],['cert','专业认证'],['camp','短期研习'],['advanced','专业进阶'],['faculty','讲师培养']].map(([k,v])=>`<button data-filter="${k}" class="${filter===k?'selected':''}">${v}</button>`).join('')}</div><div class="grid3">${filtered.map(productCard).join('')}</div>`}function coursePage(){let x=p(course);let t=[['overview','课程概览'],['reader','在线教材'],['resources','资料中心'],['assignments','作业与反馈'],['notes','学习笔记']];return `<div class="courseHeader"><div><div class="overline">${x.type} · COURSE WORKSPACE</div><h1>${x.name}</h1><p>${x.desc}</p></div><div style="min-width:130px">${tag(x.progress?'已加入 · 体验模式':'可预览 · 体验模式','green')}<div class="mini" style="margin-top:9px">示例进度 ${pct(x)}%</div>${progress(x)}</div></div><div class="tabs">${t.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'selected':''}">${v}</button>`).join('')}</div>${tab==='overview'?overview(x):tab==='reader'?reader(x):tab==='resources'?resources(x):tab==='assignments'?assignmentList(x):notes(x)}`}
function chapters(x){let arr=x.id==='snc'?['课程导论与证据思维','能量代谢与营养基础','碳水化合物的消化、吸收与储存','脂质代谢与运动适应','蛋白质、肌肉与训练','运动营养方案与客户实践']:x.id==='fifty'?['50+ 人群与健康老龄化','信息收集与训练目标','运动前健康筛查','SPPB 与基础功能','Senior Fitness Test 六项能力','评估结果与训练处方']:x.id==='ace'?['科学学习与循证基础','营养的核心原则','运动评估与沟通','实践案例与学习反馈','作业、复盘与复习卡','结业学习总结']:['专业基础与术语','结构、机制与实际应用','核心方法与练习','案例分析与证据','个体化决策','综合任务与总结'];return arr.map((title,i)=>({title,i}));}function overview(x){return `<div class="grid2"><section><div class="panel"><div class="sectline" style="margin:0 0 12px"><h2>课程学习路径</h2>${tag('示例前六单元')}</div><div class="chapterlist">${chapters(x).map((c,i)=>`<button class="chap" data-chapter="${i}" data-gotab="reader"><span class="chapnum">${String(i+1).padStart(2,'0')}</span><span><b>${c.title}</b><small>${i<2?'基础知识与实践案例':'专业教材 · 讲授与训练应用'}</small></span><span style="margin-left:auto;color:#36928b">↗</span></button>`).join('')}</div></div></section><section><div class="panel"><div class="sectline" style="margin:0 0 10px"><h2>学习空间组成</h2></div>${roadmap()}<div class="notice" style="margin-top:17px">本页展示网站功能和内容结构。正式上线时，教材正文、版权资源、学习数据与课程授权将使用真实后台。</div></div><div class="sectline"><h2>最近一次教材更新</h2></div><div class="panel"><div class="overline">TEXTBOOK VERSIONING</div><h3 style="margin:9px 0">教材版本与修订记录</h3><p class="mini">示例：章节结构、图表补充和课后案例可记录每次更新，学员能快速辨认变化。</p>${btn('查看修订记录','resources')}</div></section></div>`}
function article(x,i){if(x.id==='fifty')return `<div class="overline">专业教材示范 · 50+ COACH</div><h3>本节学习目标</h3><p>解释健康筛查、功能表现评估与训练方案设计之间的关系，并让教练可以把评估结果转换为明确的训练任务。</p><h3>一、先明确评估要回答什么</h3><p>运动前健康筛查关注当前是否适合开始训练、是否需要进一步医疗评估；功能评估关注一个人在日常生活中完成移动、平衡与站起等任务的能力；专项能力测试进一步帮助教练识别需要优先训练的能力。</p><div class="quote">实践示例：一位62岁的学员希望独立提菜上三楼。教练需要把这一生活目标与下肢力量、活动耐力、步行和负重能力关联起来。</div><h3>二、如何把结果带入训练</h3><p>SPPB包括站立平衡、短距离步行速度和连续五次坐站测试，合计0—12分。测试结果提示基本身体功能水平，但不能仅凭一个总分决定所有训练强度或医疗风险。</p><p>Senior Fitness Test可以补充下肢力量、上肢力量、有氧耐力、柔韧性和灵活移动表现。应记录测试规程、年龄参照范围、测试条件及结果的解释边界。</p><div class="quote">教练应用：识别需要优先改善的能力，再根据训练经验、运动反应和个人目标设置起始剂量，持续复测与调整。</div>`;if(x.id==='snc')return `<div class="overline">专业教材示范 · SNC 2026</div><h3>本节学习目标</h3><p>理解训练营养决策如何从基础生理过程发展到个体化方案，并能识别哪些判断有直接研究支持、哪些属于有条件的实践推断。</p><h3>一、从生理过程开始</h3><p>训练中的能量供应涉及磷酸原系统、糖酵解和氧化供能。它们始终协同工作，具体贡献受到运动强度、持续时间与训练状态的影响。</p><p>糖原是葡萄糖在肌肉及肝脏中的储存形式。肌糖原可为本肌肉运动提供底物，肝糖原则参与维持血糖稳态。</p><div class="quote">教练应用：在评价低碳水饮食、训练表现或恢复策略时，同时考虑总能量摄入、具体训练任务、训练量和个体适应。</div><h3>二、证据评价与处方</h3><p>同一营养策略在不同运动任务中的效果可能不同。阅读研究时，需要检查对照条件、样本特征、干预时长、效应量与置信区间，再决定其是否适合具体客户。</p>`;if(x.id==='ace')return `<div class="overline">研习营示范 · ACEPRESSO</div><h3>本节学习目标</h3><p>建立21天学习节奏，把章节阅读、复习卡、真实案例和小组讨论连接到一项可交付的训练或营养任务。</p><h3>今日学习流程</h3><ol class="outlineList"><li>精读指定教材并记录三个关键概念。</li><li>完成随堂自测，区分已知信息与仍需核查的判断。</li><li>结合客户场景提交简短分析，由组长汇总讨论问题。</li></ol><div class="quote">示例学习任务：用一段真实客户描述，说明目标、已知条件、需要补充的信息和行动方案。</div>`;return `<div class="overline">课程示范 · ${x.short}</div><h3>本节学习目标</h3><p>掌握${x.chapter}的核心概念，并将其用于专业教练的真实工作场景。</p><h3>基础机制与应用</h3><p>课程将按定义、结构或机制、研究依据、适用条件、实践决策与案例反馈展开，每一章保留可阅读的教材正文。</p><div class="quote">本内容用于演示阅读器、章节目录和个人笔记。正式课程正文将在资料审核完成后接入。</div>`}function reader(x){let items=chapters(x);let c=items[chapter]||items[0];let key=`${x.id}:${chapter}`;return `<div class="grid2 readerGrid"><section><div class="panel" style="padding:16px"><div class="overline" style="margin:4px 5px 12px">课程目录</div><div class="chapterlist">${items.map((a,i)=>`<button class="chap ${chapter===i?'selected':''}" data-chapter="${i}"><span class="chapnum">${i+1}</span><span><b>${a.title}</b><small>${saved.done[`${x.id}:${i}`]?'✓ 阅读标记已完成':'点击进入本节'}</small></span></button>`).join('')}</div></div></section><section><div class="panel" style="padding:26px 29px"><div class="readHead"><div><span class="mini">第 ${String(chapter+1).padStart(2,'0')} 单元 / 示范教材</span><h2>${c.title}</h2></div>${tag('DEMO · 示例内容')}</div><article class="readerArticle">${article(x,chapter)}</article><div class="buttonrow" style="margin-top:24px">${btn(saved.done[key]?'✓ 已标记完成':'标记本节已读','complete','primary')}${btn('写学习笔记','notes')}</div><p class="smallNote">提示：本页面演示排版和学习行为，非完整正式教材；勾选记录仅保存在当前浏览器。</p></div></section></div>`}function resources(x){let items=[['教材（在线阅读）','关联章节、正文、图表与修订记录','▤','reader'],['教材修订记录 · 示例 V1.1','变更说明、修订章节及版本生效日期','↻','revision'],['课堂补充资料','方法说明、论文阅读清单、课程参考资料','▧','source'],['动作演示与测试规程','视频与原始操作指引的结构占位','▷','source'],['课后应用模板','客户案例分析与作业填写说明','☷','assignments']];return `<div class="grid2"><div class="panel"><div class="sectline" style="margin:0 0 16px"><h2>课程资料库</h2>${tag('示范资料目录')}</div><div class="rows">${items.map(r=>`<div class="resource"><div class="resourceIcon">${r[2]}</div><div style="min-width:0"><h4>${r[0]}</h4><p>${r[1]}</p></div><button class="textbtn" data-action="${r[3]}">查看 →</button></div>`).join('')}</div></div><div><div class="panel"><div class="overline">REVISION HISTORY</div><h2 style="font-size:19px;margin:7px 0 17px">教材版本更新示例</h2><div class="timeline"><div class="timelinerow"><h4>V1.1 · 图片与教学链接整理</h4><p>示例更新：补充原始动作或测试资料入口</p></div><div class="timelinerow"><h4>V1.0 · 章节结构确认</h4><p>示例更新：建立学习目标、机制与实际应用</p></div><div class="timelinerow"><h4>V0.9 · 内部审核</h4><p>示例更新：统一术语和案例引用</p></div></div></div><div class="notice" style="margin-top:15px">以上版本号和日期描述用于交互演示，不代表现有教材的正式修订历史。真实资料将配置权限与原始来源链接。</div></div></div>`}function tasksFor(x){return [{name:`${x.short} · 核心概念与应用分析`,detail:'用250–400字定义一个关键概念，解释机制，并给出教练应用条件。',due:'本周内（演示）',weight:'实践分析'},{name:`${x.short} · 客户案例工作表`,detail:'从学员目标、已知条件、风险信息和行动方案四个方面展开。',due:'下一学习单元（演示）',weight:'案例作业'}]}function assignmentList(x){let tasks=tasksFor(x);return `<div class="grid2"><div><div class="sectline" style="margin-top:0"><h2>课程作业</h2>${tag('示范作业')}</div><div class="rows">${tasks.map((t,i)=>`<div class="taskcard"><div class="taskmeta">${tag(t.weight)}${tag(saved.submissions[`${x.id}:${i}`]?'已模拟提交':'待完成',saved.submissions[`${x.id}:${i}`]?'green':'gold')}</div><h3>${t.name}</h3><p>${t.detail}</p><div class="buttonrow"><button class="secondary" data-task="${i}">查看 / 填写作业 →</button></div></div>`).join('')}</div></div><div><div class="panel"><div class="overline">ASSIGNMENT WORKSPACE</div><h2 style="font-size:20px">${tasks[activeTask].name}</h2><p class="mini">${tasks[activeTask].detail}</p><div class="notice" style="margin:14px 0">这是内部演示表单。提交内容只保存在当前浏览器；不会发送给教师、学员或 ACEpresso 系统。</div><label for="taskanswer"><b>我的作业内容</b></label><textarea class="largearea" id="taskanswer" placeholder="在这里写下案例分析、训练判断或需要导师反馈的问题……">${esc(saved.submissions[`${x.id}:${activeTask}`]||'')}</textarea><div style="margin-top:12px">${btn('保存模拟提交','submit','primary')}</div><div style="border-top:1px solid var(--line);padding-top:18px;margin-top:22px"><b>导师反馈（界面示范）</b><p class="mini">未来会显示评分标准、逐项反馈、退回修改与最终成绩。本次演示不生成虚构导师评语。</p></div></div></div></div>`}function notes(x){return `<div class="grid2"><div class="panel"><div class="overline">MY LEARNING NOTES</div><h2 style="margin:8px 0">${x.name} · 个人笔记</h2><p class="mini">把阅读理解、需要核查的概念和实践想法保存下来。</p><textarea id="noteArea" class="largearea" style="min-height:230px" placeholder="记录本节要点、证据问题、需要进一步验证的应用建议……">${esc(saved.notes[x.id]||'')}</textarea><div style="margin-top:13px">${btn('保存笔记','save-note','primary')}</div></div><div class="panel"><h2 style="margin-top:0;font-size:19px">笔记建议结构</h2>${unitRow('术语与定义','用自己的话精确解释核心概念','reader')}${unitRow('机制与证据','关键推导及研究适用边界','reader')}${unitRow('客户实际应用','说明适用条件与后续验证','tasks')}<p class="smallNote">正式版可进一步支持章节锚点、跨设备云同步与讲师批注。</p></div></div>`}function tasksPage(){course=products.find(x=>x.progress>0)?.id||'snc';tab='assignments';return `${header('作业中心','按照课程查看任务、提交情况和后续导师反馈。','ASSIGNMENTS')}<div class="panel" style="margin-bottom:20px"><div class="buttonrow">${products.slice(0,3).map(x=>`<button class="${course===x.id?'primary':'secondary'}" data-course="${x.id}" data-gotab="assignments">${x.short}</button>`).join('')}</div></div>${assignmentList(p(course))}`};function materialPage(){tab='resources';return `${header('教材与资料','按课程、章节和版本追踪教材与补充资料。','RESOURCE CENTER')}<div class="grid3">${products.slice(0,3).map(x=>`<div class="panel"><span class="overline">${x.type}</span><h2 style="font-size:19px">${x.name}</h2><p class="mini">在线教材 · 版本说明 · 学习资料 · 个人批注</p>${btn('打开课程资料','resource-course-'+x.id)}</div>`).join('')}</div>`}function record(){return `${header('个人学习档案','学习过程、课后实践与未来的认证成果将汇总在这里。','LEARNING PORTFOLIO')}<div class="grid3">${stat('课程学习','3 门','演示数据')}${stat('已完成练习',String(Object.values(saved.done).filter(Boolean).length),'仅当前设备记录')}${stat('模拟作业提交',String(Object.keys(saved.submissions).length),'不发送至任何服务器')}</div><div class="sectline"><h2>我的课程学习路径</h2></div><div class="grid3">${products.slice(0,3).map(x=>`<div class="panel"><span class="overline">${x.type}</span><h2 style="font-size:17px;margin:10px 0">${x.name}</h2>${progress(x)}<div class="mini">示例进度 ${pct(x)}%</div><div style="margin-top:12px">${btn('进入课程','open-'+x.id)}</div></div>`).join('')}</div><div class="panel" style="margin-top:19px"><div class="overline">FUTURE CAPABILITY</div><h2>证书与专业成长档案</h2><p class="muted">正式版可展示课程结业标准、评核通过记录、专业能力标签和证书核验链接。目前不生成或展示虚构证书。</p></div>`}function management(){return `${header('教务与管理层设计视角','同一平台的后台结构预览：课程管理、教材发布、学习任务与质量保证。','MANAGEMENT OVERVIEW')}<div class="notice" style="margin-bottom:19px">此页为后台信息架构示意，不连接真实学员名单、成绩或招生数据。所有数量均为界面演示。</div><div class="grid3">${stat('产品模块','6','演示产品模型')}${stat('教学工作流','4','课程 / 教材 / 作业 / 评核')}${stat('真实学员数据','未接入','ACEpresso 原系统保持独立')}</div><div class="sectline"><h2>建议的管理模块</h2></div><div class="grid2"><div class="panel"><div class="rows">${[['课程产品管理','分类、定价信息、课程版本、开放状态'],['教材发布流程','编写 → 审核 → 版本发布 → 学员通知'],['作业与评核','任务发布、批阅、退回、评分规程'],['学习数据与权限','课程授权、班级分组、角色与进度报表']].map(([a,b],i)=>`<div class="unit"><span class="unitIcon">${i+1}</span><div><h4>${a}</h4><p>${b}</p></div></div>`).join('')}</div></div><div class="panel"><div class="overline">RECOMMENDED STRUCTURE</div><h2 style="font-size:19px">内容体系如何统一？</h2><p class="muted">建立一个共享底座，再让不同课程保留专属教学方式。</p><div class="timeline"><div class="timelinerow"><h4>共用学员身份与课程授权</h4><p>课程权限和购买/报名状态集中管理</p></div><div class="timelinerow"><h4>统一教材与资源库</h4><p>版本控制、引用来源、图表和视频资料</p></div><div class="timelinerow"><h4>统一作业与反馈</h4><p>适应21天研习、长期认证及师资实训</p></div><div class="timelinerow"><h4>多层角色权限</h4><p>学员、组长、讲师、教务、平台管理员</p></div></div></div></div>`}function refreshNav(){const sidebar=$('snav'),mobile=$('mnav');sidebar.innerHTML=menu.map(([k,icon,label])=>`<button class="navbtn ${view===k?'active':''}" data-view="${k}"><span class="navico">${icon}</span>${label}</button>`).join('');mobile.innerHTML=[menu[0],menu[1],menu[2],menu[4],menu[6]].map(([k,icon,label])=>`<button data-view="${k}" class="${view===k?'active':''}"><span>${icon}</span>${label}</button>`).join('')}function render(){refreshNav();$('roleSelect').value=role;let names={home:'学习首页',catalog:'全部课程',course:'课程空间',materials:'教材资料',tasks:'作业中心',record:'学习档案',management:'教学管理'};$('crumb').textContent='3HFIT / '+names[view]+' / 独立体验';$('main').innerHTML=({home,catalog,course:coursePage,materials:materialPage,tasks:tasksPage,record,management}[view]||home)();window.scrollTo({top:0,behavior:'auto'})}function go(v){if(v==='reader'||v==='resources'||v==='assignments'||v==='notes'){view='course';tab=v}else{view=v;if(v==='course'&&!tab)tab='overview'}render()}document.addEventListener('click',e=>{const a=e.target.closest('[data-view],[data-course],[data-tab],[data-filter],[data-chapter],[data-task],[data-action]');if(!a)return; if(a.dataset.view){go(a.dataset.view);return}if(a.dataset.course){course=a.dataset.course;tab=a.dataset.gotab||'overview';view='course';chapter=0;render();return}if(a.dataset.tab){tab=a.dataset.tab;render();return}if(a.dataset.filter){filter=a.dataset.filter;render();return}if(a.dataset.chapter!==undefined){chapter=+a.dataset.chapter;tab=a.dataset.gotab||'reader';render();return}if(a.dataset.task!==undefined){activeTask=+a.dataset.task;render();return}let act=a.dataset.action;if(act==='reset'){if(confirm('重置当前设备上的演示笔记、模拟作业和已读状态？')){saved={done:{},notes:{},submissions:{}};persist();view='home';render();toast('演示数据已重置')}return}if(act==='complete'){let key=`${course}:${chapter}`;saved.done[key]=!saved.done[key];persist();render();toast('当前浏览器已记录阅读状态');return}if(act==='submit'){let text=$('taskanswer')?.value.trim();if(!text){toast('请先填写一些作业内容');return}saved.submissions[`${course}:${activeTask}`]=text;persist();render();toast('模拟提交已保存在本机');return}if(act==='save-note'){saved.notes[course]=$('noteArea')?.value||'';persist();toast('笔记已保存在本机');return}if(act==='revision'){toast('修订记录已显示在右侧示例时间线');return}if(act==='source'){toast('资料结构已示范，正式链接将在后续接入');return}if(act.startsWith('resource-course-')){course=act.replace('resource-course-','');view='course';tab='resources';render();return}if(act.startsWith('open-')){course=act.replace('open-','');view='course';tab='overview';render();return}go(act)});$('roleSelect').addEventListener('change',e=>{role=e.target.value;if(role==='teacher'||role==='leader'){view='management';render()}else{view='home';render()}toast(`已切换${role==='learner'?'学员':role==='teacher'?'教务':'管理层'}演示视角`)});render();})();
</script></body></html>
